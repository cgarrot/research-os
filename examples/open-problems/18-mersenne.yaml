campaign:
  title: "Infinitude of Mersenne primes"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, number theory): Do there exist infinitely many Mersenne primes M_p = 2^p - 1? Goal: OPERATIONAL progress under our epistemic rules — Lucas-Lehmer is exact in the verifier (is_mersenne_prime / predicate mersenne_prime): re-verify ALL known Mersenne exponents up to 607+ pointwise (VERIFIED), search for new prime exponents in ranges your budget allows (search runs full budget), empirically map exponent density; aux kills."
    questions:
      - "All known small exponents re-verified exactly?"
      - "Which ranges were searched clean?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one exactly-verified claim/certificate (verifier-run)"
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
