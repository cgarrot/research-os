campaign:
  title: "Cuboïde parfait — open problem #27"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, algèbre / arithmétique): Existe-t-il un cuboïde parfait (arêtes, diagonales de faces et diagonale de l'espace toutes entières) ? Goal: OPERATIONAL progress under our epistemic rules — Any Euler brick / perfect cuboid candidate becomes a certificate-check witness: {a,b,c} with verify() checking the six face diagonals (and space diagonal for perfect) are perfect squares — exact integer math only; absence ranges stay empirical. Search a <= b <= c <= K: workers script (Euler bricks known — perfect one unknown); any witness = exact artifact (all quantities integers, checkable exactly; expressible claims pointwise verifiable); "
    questions:
      - "Searched bound; strongest recorded Euler brick?"
      - "Which parameter reductions die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: verified
        description: at least one exactly-verified bounded/witness claim (verifier-run)
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: false, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
