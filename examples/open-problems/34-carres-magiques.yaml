campaign:
  title: "Nombre de carrés magiques — open problem #34"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, combinatoire): Déterminer le nombre de carrés magiques (notamment 5x5). Goal: OPERATIONAL progress under our epistemic rules — Grounding + known counts (source-backed); workers verify small counts (3x3 = 8 modulo symmetries, 4x4 with Frenicle normalization) via scripts; aux kills."
    questions:
      - "Which counts are script-verifiable within budget?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 20
    maxTasks: 40
    maxRounds: 3
    maxExperiments: 12
    wallClockMinutes: 60
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 60 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
