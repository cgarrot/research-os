campaign:
  title: "Valeurs des nombres de van der Waerden — open problem #35"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, théorie de Ramsey): Déterminer les valeurs des nombres de van der Waerden W(k, r). Goal: OPERATIONAL progress under our epistemic rules — Lower-bound colorings ARE finite certificates: certificate-check with witness {coloring array}, verify() re-checking every arithmetic progression of length k in both colors (brute force inside verify) — exit 0 = coloring certified, W(k,r) > n VERIFIED for that n. Known values are hard-won (source-backed); workers script-verify small bounds (SAT/brute force for W(2,3)=9 etc. — exact artifacts: a coloring avoiding APs of length k is a FINITE checkable certificat"
    questions:
      - "Which W(k,r) bounds are script-certifiable in budget?"
      - "Which structural shortcuts die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: verified
        description: at least one exactly-verified bounded/witness claim (verifier-run)
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
