campaign:
  title: "RED-TEAM — 15b-taxicab-5-gap-question (destroy the result of campaign:c_35)"
  modules: [mathematics]
  objective:
    statement: "You are a RED TEAM. The campaign campaign:c_35 claims 1 verified results. Your SOLE objective is to DESTROY them. Attack every verified claim: (1) RE-COMPUTE independently from scratch — different algorithm, different implementation, no access to the original scripts; (2) hunt for counterexamples the original missed — edge cases, boundary values, larger domains; (3) check for CIRCULAR REASONING — does the verification depend on the thing being verified?; (4) attack the certificates — are the witnesses actually valid? did the verifier check what the claim says?; (5) test the claims under adversarial perturbation — if the claim says 'for all n ≤ K', test n = K+1, K+10, K+100; (6) look for off-by-one, sign errors, indexing errors, overflow; (7) check the bound-integrity — does the claim's stated bound match what was actually verified? If EVERY attack fails and the results hold, submit a synthesis noting they SURVIVED red-team. If ANY attack succeeds, the result is DESTROYED — document exactly how and why."
    questions:
      - "Can each verified claim be independently reproduced from scratch?"
      - "Are there counterexamples just beyond the verified bounds?"
      - "Is there any circularity in the verification chain?"
      - "Do the certificates actually prove what the claims state?"
    deliverables:
      - kind: report
        description: "Red-team verdict: SURVIVED or DESTROYED with precise failure modes"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one independent re-verification performed (proving the red-team did real work, not rubber-stamping)"
    constraints:
      - "re-implement from scratch — NEVER reuse the original campaign's scripts or artifacts as starting points"
      - "exact arithmetic only; every re-computation must be independent"
      - "if you destroy a result, document the exact failure mode for the human"
    exclusions: []
    assumptions: ["source campaign claims visible via ContextPack.priorRuns"]
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search: { policy: round-robin, blindGenerators: 1, maxBranches: 4 }
  budgets: { maxAgentRuns: 12, maxTasks: 20, maxRounds: 2, maxExperiments: 10, wallClockMinutes: 120, maxTokensEstimate: 15000000 }
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 1800, maxRunMinutes: 120 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 2, successSemantics: "any", minRounds: 1, requireCycle: false }
  modulePrompts:
    worker: "RED-TEAM MODE: your ContextPack.priorRuns shows what campaign:c_35 verified. Your job is DESTRUCTION, not confirmation. Re-implement every computation from scratch (different approach if possible). Hunt for counterexamples beyond the verified bounds. Check circularity. Attack the certificates. If results hold → they earned the survived-red-team badge. If any fails → document the precise failure. This is constructive destruction: the goal is that whatever survives is TRUSTWORTHY."
  verification: { requireIndependentAudit: true }
