campaign:
  title: "Seuil de percolation — formule générale"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, théorie des graphes / probabilités): Trouver une formule générale pour le seuil de percolation d'un graphe. Goal: OPERATIONAL progress under our epistemic rules — Grounding + known thresholds table (source-backed); simulations = exploration only (random — never exact evidence); aux kills on naive formulas (workers test candidate formulas against known exact thresholds — falsification IS exact)."
    questions:
      - "Which candidate formulas die against known thresholds?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 20
    maxTasks: 40
    maxRounds: 3
    maxExperiments: 12
    wallClockMinutes: 60
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 60 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
