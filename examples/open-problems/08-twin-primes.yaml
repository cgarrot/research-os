campaign:
  title: "Nombres premiers jumeaux — open problem #8"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, théorie des nombres): Conjecture des nombres premiers jumeaux : il existe une infinité de premiers p tels que p+2 soit premier. Goal: OPERATIONAL progress under our epistemic rules — Twin = Polignac k=1. (1) verify the largest twin-free interval structure via next_prime_gap (pointwise verified witnesses); (2) empirical support: twin counts up to 10^7 in worker scripts (numerical-evidence framing); (3) falsify auxiliaries about twin density/monotonicity; (4) source-backed: Zhang/Maynard bounded-gap results."
    questions:
      - "Verified twin witnesses at interesting scales (10^k)?"
      - "Which density monotonicity claims die exactly?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: verified
        description: at least one exactly-verified bounded/witness claim (verifier-run)
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
