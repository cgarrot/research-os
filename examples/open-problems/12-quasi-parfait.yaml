campaign:
  title: "Nombres quasi parfaits (sigma(n) = n+1)"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, théorie des nombres): Existe-t-il un nombre quasi parfait (σ(n) = 2n+1, c.-à-d. abondance Δ(n) = σ(n)−2n égale à 1) ? Goal: OPERATIONAL progress under our epistemic rules — ATTENTION définition exacte : quasi-parfait ⟺ σ(n) = 2n+1 (Δ(n)=1), PAS σ(n)=n+1 (qui caractériserait les premiers — erreur du run 1 falsifiée à n=2). (1) VERIFIED BOUNDED ABSENCE: exhaustive-finite expression 'divisor_sum(n)-2*n-1' predicate not_equals:0 sur n impair [1,K] (les quasi-parfaits ≥ 2 sont abondants impairs non parfaits — impair seulement d'après la théorie; un quasi-parfait pair serait presque-parfait, cas séparé) ; (2) lien : Δ=1 impair ⟺ l'échec simultané des recherches d'étranges impairs d'abondance minimale (voir knowledge 13-etrange-impair) ; (3) auxiliaires falsifiables sur la structure de Δ."
    questions:
      - "Largest exactly-verified K with no odd quasi-perfect (Δ=1)?"
      - "Quelles bornes la théorie impose-t-elle déjà (source-backed) ?"
      - "Quelles auxiliaires sur la structure Δ meurent exactement ?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one exactly-verified claim/certificate (verifier-run)"
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
