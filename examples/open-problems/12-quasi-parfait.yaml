campaign:
  title: "Nombres quasi parfaits (sigma(n) = n+1)"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia (unsolved problems), number theory): Does there exist a quasiperfect number (σ(n) = 2n+1, i.e. abundance Δ(n) = σ(n)−2n equal to 1)? Goal: OPERATIONAL progress under our epistemic rules — CAREFUL exact definition: quasiperfect ⟺ σ(n) = 2n+1 (Δ(n)=1), NOT σ(n)=n+1 (which would characterize the primes — a run-1 error falsified at n=2). (1) VERIFIED BOUNDED ABSENCE: exhaustive-finite expression divisor_sum(n)-2*n-1 predicate not_equals:0 over odd n in [1,K] (quasiperfect numbers >= 2 are odd non-perfect abundant — odd only per theory; even quasiperfect would be almost perfect, separate case); (2) link: odd Δ=1 is equivalent to simultaneous failure of odd weird number searches at minimal abundance (see knowledge 13-etrange-impair); (3) falsifiable auxiliaries on the structure of Δ."
    questions:
      - "Largest exactly-verified K with no odd quasi-perfect (Δ=1)?"
      - "What bounds does theory already impose (source-backed)?"
      - "Quelles auxiliaires sur la structure Δ meurent exactement ?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one exactly-verified claim/certificate (verifier-run)"
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
