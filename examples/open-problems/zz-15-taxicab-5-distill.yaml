campaign:
  title: "DISTILL — 15-taxicab-5 (agent consolidation of campaign:c_20)"
  modules: [mathematics]
  objective:
    statement: "You are a CONSOLIDATOR: read the full event journal of campaign:c_20 (research_get_journal, all pages — 977 events) and distill what the mechanical extractor CANNOT capture. Produce 3-7 knowledge lessons: (1) LESSONS — the 3-5 things that actually mattered (which strategy won, what was the real bottleneck, what surprised); (2) GENERALIZED-SKILLS — procedures learned here that transfer to OTHER problems (C-sharding for parallel scans? band-search O(1) memory? modular corridors?); (3) CROSS-LINKS — real analogies to other problems in the queue; (4) SYNTHESIS — a 5-sentence narrative for the next round. MANDATORY: every lesson cites sourceEventIds you actually read."
    questions:
      - "What were the 3 most important strategic decisions in the journal?"
      - "Which learned procedures transfer to other problems (Ramsey? Waring? cuboid?)"
      - "What narrative summary would help the next round start smarter?"
    deliverables:
      - kind: report
        description: "Distilled lessons with journal citations"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one lesson accepted through the source-validation gate"
    constraints:
      - "every lesson MUST cite real event ids from research_get_journal"
      - "lessons without sources are rejected — no invention"
    exclusions: []
    assumptions: []
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search: { policy: round-robin, blindGenerators: 1, maxBranches: 2 }
  budgets: { maxAgentRuns: 4, maxTasks: 6, maxRounds: 1, maxExperiments: 2, wallClockMinutes: 45, maxTokensEstimate: 10000000 }
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 1, leaseSeconds: 1800, maxRunMinutes: 45 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 1, successSemantics: "any", minRounds: 1, requireCycle: false }
  modulePrompts:
    worker: "CONSOLIDATOR MODE: use research_get_journal to read ALL pages of campaign:c_20's journal (977 events — object.created, claim.status_changed, verification.passed, memory.episode_created). Then submit 3-7 research_submit_lesson calls: kind lesson/generalized-skill/cross-link/synthesis, each with sourceEventIds from the journal you READ. The validation gate rejects fabricated ids — only cite what you saw."
  verification: { requireIndependentAudit: true }
