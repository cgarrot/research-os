campaign:
  title: "Problème de Hadwiger–Nelson — open problem #47"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, théorie des graphes / géométrie): Nombre chromatique du plan (entre 5 et 7 après de Grey). Goal: OPERATIONAL progress under our epistemic rules — Unit-distance graph coloring certificates: a finite graph + coloring is exactly checkable in scripts (artifact); workers reproduce the 5-chromatic construction era results on small graphs, verify 4-colorability of classical unit-distance graphs (Moser spindle etc.); falsify claims of smaller chromatic unit graphs."
    questions:
      - "Classical spindles script-verified?"
      - "Which candidate bounds die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: verified
        description: at least one exactly-verified bounded/witness claim (verifier-run)
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 36
    maxTasks: 80
    maxRounds: 5
    maxExperiments: 30
    wallClockMinutes: 240
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 240 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
