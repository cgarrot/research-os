campaign:
  title: "Régularité des solutions de Navier–Stokes — open problem #53"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, EDP / analyse): Existence et régularité globale des solutions des équations de Navier–Stokes 3D (prix du millénaire). Goal: OPERATIONAL progress under our epistemic rules — Grounding: what regularity results exist, energy estimates as source-backed; numerical simulations = exploration only (never evidence); aux kills on naive blowup claims."
    questions:
      - "Known partial regularity ladder (Caffarelli–Kohn–Nirenberg); which toy claims die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled"
    successCriteria:
      - type: claim_status
        value: falsified
        description: at least one auxiliary conjecture falsified by an exact counterexample
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 20
    maxTasks: 40
    maxRounds: 3
    maxExperiments: 12
    wallClockMinutes: 60
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 60 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
