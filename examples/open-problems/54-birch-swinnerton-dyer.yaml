campaign:
  title: "Conjecture de Birch et Swinnerton-Dyer"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, arithmetic geometry): The Birch and Swinnerton-Dyer conjecture (Millennium Prize): the link between the rank of an elliptic curve and the order of vanishing of its L-function. Goal: OPERATIONAL progress under our epistemic rules — COMPUTATIONALLY MEANINGFUL on specific curves: workers use sympy/sage-free elliptic point counting (or mwrank-free scripts) to compute ranks and L-series coefficients for SMALL curves (conductor < 10^5): empirical BSD checks (support only); pointwise verifiable arithmetic (e.g. 'point P has infinite order' via scripts, artifacts); falsify auxiliaries (rank heuristics, parity claims on curve families); source-backed: known rank records."
    questions:
      - "Which small curves checked empirically against BSD?"
      - "Heuristics that die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one exactly-verified claim/certificate (verifier-run)"
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
