campaign:
  title: "Infinitude of prime quadruplets"
  modules: [mathematics]
  objective:
    statement: "Open problem (Wikipedia FR, number theory): Do there exist infinitely many prime quadruplets (p, p+2, p+6, p+8)? Goal: OPERATIONAL progress under our epistemic rules — Pointwise VERIFIED quadruplet witnesses via certificate-check: witness {p,q,r,s}, tupleAllPrime [p,q,r,s], exact expression 'p*p+p*2' style checks per component (or verify() asserting p+2==q, q+4==r, r+2==s and primality) — certificates, not just script artifacts. Pointwise VERIFIED quadruplet witnesses (is_prime on 4 values via exact-point or script artifacts + verifier points); prime constellation pattern constraints (mod 210 etc.) as source-backed; empirical"
    questions:
      - "Verified quadruplet witnesses at scale?"
      - "Which structural claims die?"
    deliverables:
      - kind: report
        description: "Evidence-backed report: verified/witness results, falsified auxiliaries, empirical support clearly labeled, discovery candidates + novelty statuses"
    successCriteria:
      - type: claim_status
        value: verified
        description: "at least one exactly-verified claim/certificate (verifier-run)"
      - type: claim_status
        value: falsified
        description: "at least one auxiliary conjecture falsified by an exact counterexample"
    constraints:
      - "exact integer arithmetic only (floats are exploration, never evidence)"
      - "never claim more than what was verified: state bounds honestly"
      - "known literature results are source-backed claims, not campaign-verified"
      - "records: NO hand-written frontier numbers — dated frontier snapshots only"
    exclusions:
      - "no unbounded claims from computation"
    assumptions:
      - "standard mathematical definitions"
    riskClass: low
  models:
    defaultPool:
      - id: zai-glm-5.3
        provider: zai
        model: glm-5.3
        runtime: pi
        thinkingLevel: max
        tags: [default]
  search:
    policy: round-robin
    blindGenerators: 3
    maxBranches: 8
  budgets:
    maxAgentRuns: 60
    maxTasks: 120
    maxRounds: 8
    maxExperiments: 60
    wallClockMinutes: 600
    maxTokensEstimate: 50000000
  autonomy: { level: L3, humanApprovalRequiredFor: [] }
  workers: { autoSpawn: 2, leaseSeconds: 3600, maxRunMinutes: 360 }
  stop: { onSuccess: true, onBudgetExhausted: true, noProgressRounds: 3, successSemantics: "all", minRounds: 2, requireCycle: true }
  verification: { requireIndependentAudit: true }
